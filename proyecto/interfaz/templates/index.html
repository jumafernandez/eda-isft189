<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clasificador de flores Iris</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; margin: 40px auto; }
    label { display: block; margin-top: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
    button { margin-top: 18px; padding: 8px 18px; }
    .resultado { margin-top: 22px; padding: 14px; border-radius: 6px;
                 background: #e8f5e9; color: #1b5e20; }
  </style>
</head>
<body>
  <h1>Clasificador de flores Iris</h1>

  <form method="post">
    <label>Largo del sépalo (cm)
      <input type="number" step="0.1" name="largo_sepalo"
             value="{{ datos.largo_sepalo }}">
    </label>
    <label>Ancho del sépalo (cm)
      <input type="number" step="0.1" name="ancho_sepalo"
             value="{{ datos.ancho_sepalo }}">
    </label>
    <label>Largo del pétalo (cm)
      <input type="number" step="0.1" name="largo_petalo"
             value="{{ datos.largo_petalo }}">
    </label>
    <label>Ancho del pétalo (cm)
      <input type="number" step="0.1" name="ancho_petalo"
             value="{{ datos.ancho_petalo }}">
    </label>
    <button type="submit">Predecir</button>
  </form>

  {% if especie %}
  <p class="resultado">Especie predicha: {{ especie }}</p>
  {% endif %}
</body>
</html>
